name: Build and release Desktop apps

on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset_name: nothingos-flasher-macos-universal.zip
          - os: windows-latest
            platform: windows
            asset_name: nothingos-flasher-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            asset_name: nothingos-flasher-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # macOS build & archive
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Compress macOS bundle
        if: matrix.platform == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ${{ matrix.asset_name }} nothingos_flasher.app
          mv ${{ matrix.asset_name }} ../../../../../

      # Windows build & archive
      - name: Build Windows app
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Compress Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "${{ matrix.asset_name }}"

      # Linux build & archive
      - name: Install Linux Build Tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Linux app
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Compress Linux bundle
        if: matrix.platform == 'linux'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C build/linux/x64/release/bundle .

      # Upload built zips to GitHub Actions artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/nothingos-flasher-macos-universal.zip
            release-assets/nothingos-flasher-windows-x64.zip
            release-assets/nothingos-flasher-linux-x64.tar.gz
